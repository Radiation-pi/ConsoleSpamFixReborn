# Paper 26.2 / Java 25. Old 1.x and 2.x filter configs migrate with a backup.
schema-version: 1
installation:
  # Changing stage requires a server restart. BOOTSTRAP gives earliest coverage.
  stage: BOOTSTRAP

# First match wins. Fields are ANDed; entries inside each *-any list are ORed.
# Empty rules filter nothing. Copy the disabled example and enable it as needed.
rules:
  - id: authlib-public-key-timeout
    enabled: false
    logger-names: [com.mojang.authlib.yggdrasil.YggdrasilServicesKeyInfo]
    levels: [ERROR]
    message-equals: 'Failed to request yggdrasil public key'
    throwable-any:
      - class: java.net.SocketTimeoutException
        message-contains-any: ['Connect timed out', 'Read timed out']
    action: DROP

# Full filtered events and exceptions, written by one bounded background worker.
# Queue overflow drops archive entries and increments archiveDropped; never blocks logging.
archive:
  enabled: false
  queue-capacity: 2048
  max-file-mb: 16
  max-files: 4
