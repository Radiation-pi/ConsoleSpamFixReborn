# Paper 26.2 / Java 25. Old 1.x and 2.x filter configs migrate with a backup.
schema-version: 1
installation:
  # Changing stage requires a server restart. BOOTSTRAP gives earliest coverage.
  stage: BOOTSTRAP

# Each item is a Java regular expression. Any matching item drops the event.
# Regex matching searches anywhere in the formatted message unless anchored with ^ and $.
# Empty rules filter nothing. Quote regexes containing YAML punctuation or spaces.
rules: []

# Full filtered events and exceptions, written by one bounded background worker.
# Queue overflow drops archive entries and increments archiveDropped; never blocks logging.
archive:
  enabled: false
  queue-capacity: 2048
  max-file-mb: 16
  max-files: 4
