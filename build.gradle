import groovy.json.JsonOutput

plugins { id 'java' }

group = 'link.star_dust'
version = '2.1.0-paper.1'
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}
dependencies {
    if (providers.gradleProperty('serverLibraries').isPresent()) {
        compileOnly fileTree(providers.gradleProperty('serverLibraries').get()) { include '**/*.jar' }
    } else {
        compileOnly 'io.papermc.paper:paper-api:26.2.build.134-stable'
        compileOnly 'org.apache.logging.log4j:log4j-core:2.26.0'
        compileOnly 'org.spongepowered:configurate-yaml:4.2.0'
    }
    testImplementation files(configurations.compileClasspath)
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

def orderFile = layout.projectDirectory.file(providers.gradleProperty('loadOrderFile').getOrElse('load-order.properties'))
def pluginVersion = project.version.toString()
tasks.named('processResources') {
    inputs.file(orderFile)
    inputs.property('version', project.version)
    doLast {
        Properties order = new Properties()
        orderFile.asFile.withInputStream { order.load(it) }
        def dependencies = [:]
        ['bootstrap', 'server'].each { phase ->
            def entries = [:]
            ['before', 'after'].each { direction ->
                order.getProperty("${phase}.${direction}", '').split(',').collect { it.trim() }.findAll { it }.each { target ->
                    if (!(target ==~ /[A-Za-z0-9_.-]+/) || target == 'ConsoleSpamFixReborn' || entries.containsKey(target)) {
                        throw new GradleException("Invalid or conflicting ${phase} load target: ${target}")
                    }
                    entries[target] = [load: direction == 'before' ? 'AFTER' : 'BEFORE', required: false, 'join-classpath': false]
                }
            }
            dependencies[phase] = entries
        }
        def descriptor = [name: 'ConsoleSpamFixReborn', version: pluginVersion,
            main: 'link.star_dust.consolefix.paper.ConsoleFixPlugin',
            bootstrapper: 'link.star_dust.consolefix.paper.ConsoleFixBootstrap',
            loader: 'link.star_dust.consolefix.paper.ConsoleFixLoader',
            'api-version': '26.2', load: 'STARTUP',
            authors: ['CraftersLand', 'Author87668', 'Radiation-pi'],
            description: 'Paper console filtering with early bootstrap installation.', dependencies: dependencies,
            permissions: ['csf.admin': [description: 'Manage console filters', default: 'op']]]
        // JSON is valid YAML; no build-time YAML dependency is needed.
        new File(destinationDir, 'paper-plugin.yml').text = JsonOutput.prettyPrint(JsonOutput.toJson(descriptor)) + '\n'
    }
}
tasks.register('behaviorTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'link.star_dust.consolefix.paper.BehaviorTest'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
tasks.named('check') { dependsOn 'behaviorTest' }
tasks.named('test') { enabled = false } // Behavior tests use real Log4j without a test framework.
tasks.named('jar') {
    archiveBaseName = 'ConsoleSpamFixReborn'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
